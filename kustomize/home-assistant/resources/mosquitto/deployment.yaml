---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: passwd
          image: eclipse-mosquitto:2.0.23@sha256:6a332cc7a8dbe011cbc076180cbb76b37c6f0f55809682ea08e7980ef0112ad9
          command:
            - sh
            - -c
            - |
              cp /mosquitto/config/acl /mosquitto/auth/acl
              chmod 600 /mosquitto/auth/acl
              mosquitto_passwd -b -c /mosquitto/auth/passwd homeassistant "$HOMEASSISTANT_PASSWORD"
              mosquitto_passwd -b /mosquitto/auth/passwd zigbee2mqtt "$ZIGBEE2MQTT_PASSWORD"
          env:
            - name: HOMEASSISTANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mqtt-homeassistant
                  key: password
            - name: ZIGBEE2MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mqtt-zigbee2mqtt
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/acl
              subPath: acl
            - name: auth
              mountPath: /mosquitto/auth
            - name: tmp
              mountPath: /tmp
      containers:
        - name: mosquitto
          # renovate: datasource=docker depName=eclipse-mosquitto package=eclipse-mosquitto
          image: eclipse-mosquitto:2.0.23@sha256:6a332cc7a8dbe011cbc076180cbb76b37c6f0f55809682ea08e7980ef0112ad9
          ports:
            - name: mqtt
              containerPort: 1883
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: mqtt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: mosquitto
        - name: auth
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto
