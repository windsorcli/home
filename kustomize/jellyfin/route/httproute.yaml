apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: app-jellyfin
spec:
  parentRefs:
    - kind: Gateway
      name: internal
      namespace: system-gateway
      sectionName: web-https
  hostnames:
    - jellyfin.${jellyfin_domain}
  rules:
    - backendRefs:
        - kind: Service
          name: jellyfin
          port: 8096
