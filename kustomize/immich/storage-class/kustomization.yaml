apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: PersistentVolumeClaim
      name: immich-.*
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: ${immich_storage_class}
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: immich-db
    patch: |-
      - op: add
        path: /spec/storage/storageClass
        value: ${immich_storage_class}
