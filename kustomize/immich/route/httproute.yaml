apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: app-immich
spec:
  parentRefs:
    - kind: Gateway
      name: internal
      namespace: system-gateway
      sectionName: web-https
  hostnames:
    - immich.${immich_domain}
  rules:
    - backendRefs:
        - kind: Service
          name: immich-server
          port: 2283
