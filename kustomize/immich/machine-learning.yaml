apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: app-immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: immich-machine-learning
          # renovate: datasource=docker depName=ghcr.io/immich-app/immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
          env:
            - name: MACHINE_LEARNING_MODEL_REVISION
              value: v2
          ports:
            - name: http
              containerPort: 3003
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: app-immich
spec:
  type: ClusterIP
  selector:
    app: immich-machine-learning
  ports:
    - name: http
      port: 3003
      targetPort: http
