$schema: https://json-schema.org/draft/2020-12/schema
title: Windsor Home Blueprint Configuration Schema
description: Home-specific configuration, merged with the schema that core contributes through the core source.
type: object

# Core's schema arrives with the core source and merges into this one. This file
# carries only the keys that home adds. Do not redeclare a core key and do not define $defs.

properties:

  home_assistant:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Deploy Home Assistant.
      storage_class:
        type: string
        description: StorageClass for each Home Assistant volume. Unset uses the cluster default.
    additionalProperties: false

  jellyfin:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Deploy Jellyfin.
      storage_class:
        type: string
        description: StorageClass for each Jellyfin volume. Unset uses the cluster default.
    additionalProperties: false

  immich:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Deploy Immich.
      storage_class:
        type: string
        description: StorageClass for each Immich volume. Unset uses the cluster default.
    additionalProperties: false

  frigate:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Deploy Frigate.
      storage_class:
        type: string
        description: StorageClass for each Frigate volume. Unset uses the cluster default.
    additionalProperties: false
