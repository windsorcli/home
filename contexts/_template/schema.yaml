$schema: https://json-schema.org/draft/2020-12/schema
title: Windsor Home Blueprint Configuration Schema
description: Home-specific configuration, merged with the schema that core contributes through the core source.
type: object

# Core's schema arrives with the core source and merges into this one. This file
# carries only the keys that home adds. Do not redeclare a core key and do not define $defs.

properties:

  home_assistant:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Deploy Home Assistant.
      gateway:
        type: string
        enum:
          - internal
          - external
          - both
        description: Gateway that carries each Home Assistant route. Unset means internal. external and both fail composition in home v0.1.0, because home ADR 0001 forbids dns.public_domain.
      zigbee2mqtt:
        type: object
        properties:
          gateway:
            type: string
            enum:
              - internal
              - external
              - both
            description: Gateway that carries the Zigbee2MQTT route. Unset reads home_assistant.gateway. external and both fail composition in home v0.1.0, because home ADR 0001 forbids dns.public_domain.
          auth_token:
            type: string
            sensitive: true
            description: Token that the Zigbee2MQTT web UI requires. Unset generates one, and the zigbee2mqtt-frontend Secret holds it.
        additionalProperties: false
      mqtt:
        type: object
        properties:
          homeassistant_password:
            type: string
            sensitive: true
            description: Password of the Mosquitto user homeassistant. Unset generates one, and the mqtt-homeassistant Secret holds it.
          zigbee2mqtt_password:
            type: string
            sensitive: true
            description: Password of the Mosquitto user zigbee2mqtt. Unset generates one, and the mqtt-zigbee2mqtt Secret holds it.
        additionalProperties: false
      storage_class:
        type: string
        enum:
          - single
          - replicated
        description: StorageClass for each Home Assistant volume. Unset uses the cluster default, single. replicated needs a csi driver that creates it, such as longhorn HA or mayastor.
    additionalProperties: false

  jellyfin:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Deploy Jellyfin.
      gateway:
        type: string
        enum:
          - internal
          - external
          - both
        description: Gateway that carries each Jellyfin route. Unset means internal. external and both fail composition in home v0.1.0, because home ADR 0001 forbids dns.public_domain.
      storage_class:
        type: string
        enum:
          - single
          - replicated
        description: StorageClass for each Jellyfin volume. Unset uses the cluster default, single. replicated needs a csi driver that creates it, such as longhorn HA or mayastor.
    additionalProperties: false

  immich:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Deploy Immich.
      gateway:
        type: string
        enum:
          - internal
          - external
          - both
        description: Gateway that carries each Immich route. Unset means internal. external and both fail composition in home v0.1.0, because home ADR 0001 forbids dns.public_domain.
      storage_class:
        type: string
        enum:
          - single
          - replicated
        description: StorageClass for each Immich volume. Unset uses the cluster default, single. replicated needs a csi driver that creates it, such as longhorn HA or mayastor.
    additionalProperties: false

  frigate:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Deploy Frigate.
      gateway:
        type: string
        enum:
          - internal
          - external
          - both
        description: Gateway that carries each Frigate route. Unset means internal. external and both fail composition in home v0.1.0, because home ADR 0001 forbids dns.public_domain.
      storage_class:
        type: string
        enum:
          - single
          - replicated
        description: StorageClass for each Frigate volume. Unset uses the cluster default, single. replicated needs a csi driver that creates it, such as longhorn HA or mayastor.
    additionalProperties: false
