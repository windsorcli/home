# app-immich.yaml facet tests
# The facet takes an optional storage_class and needs dns.private_domain for its host name.

cases:
  - name: accepts immich.enabled with a private domain
    values:
      dns:
        private_domain: home.example.com
      immich:
        enabled: true

  - name: accepts an immich.storage_class override
    values:
      dns:
        private_domain: home.example.com
      immich:
        enabled: true
        storage_class: replicated

  - name: rejects an unknown immich key
    values:
      dns:
        private_domain: home.example.com
      immich:
        enabled: true
        node_selector:
          disk: ssd
    expectError: true

  - name: fails composition without dns.private_domain
    values:
      immich:
        enabled: true
    expectError: true

  - name: skips the domain check when immich is disabled
    values:
      immich:
        enabled: false
