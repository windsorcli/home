# app-jellyfin.yaml facet tests
# The facet deploys the workload, its GPU request, its internal route, and its volumes.

cases:
  - name: deploys the workload and the internal route
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
    expect:
      kustomize:
        - name: app-jellyfin
          path: jellyfin
          components:
            - route
          substitutions:
            jellyfin_domain: home.example.com
    exclude:
      kustomize:
        - name: app-jellyfin-external

  - name: omits the workload when jellyfin is disabled
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: false
    exclude:
      kustomize:
        - name: app-jellyfin

  - name: leaves the storage class out when unset
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
    expect:
      kustomize:
        - name: app-jellyfin
          components:
            - route

  - name: sets the storage class on each volume when single
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        storage_class: single
    expect:
      kustomize:
        - name: app-jellyfin
          components:
            - storage-class
            - route
          substitutions:
            jellyfin_storage_class: single

  - name: sets the storage class on each volume when replicated
    values:
      cluster:
        storage:
          driver: mayastor
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        storage_class: replicated
    expect:
      kustomize:
        - name: app-jellyfin
          components:
            - storage-class
            - route
          substitutions:
            jellyfin_storage_class: replicated

  - name: accepts jellyfin.enabled with a private domain
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true

  - name: accepts a jellyfin.storage_class override
    values:
      cluster:
        storage:
          driver: mayastor
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        storage_class: replicated

  - name: accepts jellyfin.storage_class single
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        storage_class: single

  - name: rejects a jellyfin.storage_class outside the enum
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        storage_class: fast
    expectError: true

  - name: rejects an unknown jellyfin key
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        node_selector:
          disk: ssd
    expectError: true

  - name: fails composition without dns.private_domain
    values:
      jellyfin:
        enabled: true
    expectError: true

  - name: skips the domain check when jellyfin is disabled
    values:
      jellyfin:
        enabled: false

  - name: accepts jellyfin.gateway internal
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        gateway: internal

  - name: rejects jellyfin.gateway outside the enum
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        gateway: lan
    expectError: true

  - name: fails composition when jellyfin.gateway is external
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        gateway: external
    expectError: true

  - name: fails composition when jellyfin.gateway is both
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        gateway: both
    expectError: true

  - name: skips the gateway check when jellyfin is disabled
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: false
        gateway: external

  - name: fails composition for jellyfin.storage_class replicated on the default driver
    values:
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        storage_class: replicated
    expectError: true

  - name: fails composition for jellyfin.storage_class replicated on longhorn without ha
    values:
      cluster:
        storage:
          driver: longhorn
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        storage_class: replicated
    expectError: true

  - name: accepts jellyfin.storage_class replicated on longhorn with ha
    values:
      topology: ha
      cluster:
        storage:
          driver: longhorn
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        storage_class: replicated

  - name: accepts jellyfin.storage_class replicated on mayastor
    values:
      cluster:
        storage:
          driver: mayastor
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        storage_class: replicated

  - name: fails composition for jellyfin.storage_class replicated on openebs
    values:
      cluster:
        storage:
          driver: openebs
      dns:
        private_domain: home.example.com
      jellyfin:
        enabled: true
        storage_class: replicated
    expectError: true
