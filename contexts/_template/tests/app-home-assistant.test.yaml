# app-home-assistant.yaml facet tests
# The facet takes optional storage_class and gateway keys and needs dns.private_domain for its host name.

cases:
  - name: accepts home_assistant.enabled with a private domain
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true

  - name: accepts a home_assistant.storage_class override
    values:
      cluster:
        storage:
          driver: mayastor
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        storage_class: replicated

  - name: accepts home_assistant.storage_class single
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        storage_class: single

  - name: rejects a home_assistant.storage_class outside the enum
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        storage_class: fast
    expectError: true

  - name: rejects an unknown home_assistant key
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        node_selector:
          disk: ssd
    expectError: true

  - name: fails composition without dns.private_domain
    values:
      home_assistant:
        enabled: true
    expectError: true

  - name: skips the domain check when home_assistant is disabled
    values:
      home_assistant:
        enabled: false

  - name: accepts home_assistant.gateway internal
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        gateway: internal

  - name: rejects home_assistant.gateway outside the enum
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        gateway: lan
    expectError: true

  - name: fails composition when home_assistant.gateway is external
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        gateway: external
    expectError: true

  - name: fails composition when home_assistant.gateway is both
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        gateway: both
    expectError: true

  - name: accepts zigbee2mqtt.gateway internal with home_assistant.gateway unset
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        zigbee2mqtt:
          gateway: internal

  - name: accepts zigbee2mqtt.gateway and home_assistant.gateway both internal
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        gateway: internal
        zigbee2mqtt:
          gateway: internal

  - name: rejects home_assistant.zigbee2mqtt.gateway outside the enum
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        zigbee2mqtt:
          gateway: lan
    expectError: true

  - name: fails composition when home_assistant.zigbee2mqtt.gateway is external
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        zigbee2mqtt:
          gateway: external
    expectError: true

  - name: fails composition when home_assistant.zigbee2mqtt.gateway is both
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        zigbee2mqtt:
          gateway: both
    expectError: true

  - name: fails composition when zigbee2mqtt.gateway is external and home_assistant.gateway is internal
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        gateway: internal
        zigbee2mqtt:
          gateway: external
    expectError: true

  - name: home_assistant.gateway external fails even when zigbee2mqtt.gateway is internal
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        gateway: external
        zigbee2mqtt:
          gateway: internal
    expectError: true

  - name: skips the gateway check when home_assistant is disabled
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: false
        gateway: external

  - name: fails composition for home_assistant.storage_class replicated on the default driver
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        storage_class: replicated
    expectError: true

  - name: fails composition for home_assistant.storage_class replicated on longhorn without ha
    values:
      cluster:
        storage:
          driver: longhorn
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        storage_class: replicated
    expectError: true

  - name: accepts home_assistant.storage_class replicated on longhorn with ha
    values:
      topology: ha
      cluster:
        storage:
          driver: longhorn
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        storage_class: replicated

  - name: accepts home_assistant.storage_class replicated on mayastor
    values:
      cluster:
        storage:
          driver: mayastor
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        storage_class: replicated

  - name: fails composition for home_assistant.storage_class replicated on openebs
    values:
      cluster:
        storage:
          driver: openebs
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        storage_class: replicated
    expectError: true

  - name: fails composition when home_assistant.gateway is external and zigbee2mqtt.gateway is unset
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        gateway: external
    expectError: true

  - name: deploys the three workloads with the common component
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
    expect:
      flux:
        - name: home-assistant
          path: home-assistant
          resources:
            - timeout: 10m
              interval: 5m
              components:
                - common
                - home-assistant
                - mosquitto
                - zigbee2mqtt

  - name: adds the single storage class to each volume
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        storage_class: single
    expect:
      flux:
        - name: home-assistant
          resources:
            - components:
                - common
                - home-assistant
                - mosquitto
                - zigbee2mqtt
                - storage/single

  - name: adds the replicated storage class to each volume
    values:
      cluster:
        storage:
          driver: mayastor
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        storage_class: replicated
    expect:
      flux:
        - name: home-assistant
          resources:
            - components:
                - common
                - home-assistant
                - mosquitto
                - zigbee2mqtt
                - storage/replicated

  - name: publishes the routes under the private domain
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
    expect:
      flux:
        - name: home-assistant
          resources:
            - name: routes
              components:
                - gateway
              substitutions:
                home_assistant_domain: home.example.com

  - name: deploys nothing when home_assistant is disabled
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: false
    exclude:
      flux:
        - name: home-assistant

  - name: generates each secret when no value is set
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
    terraformOutputs:
      home-assistant-mqtt-password:
        value: generated-ha
      zigbee2mqtt-mqtt-password:
        value: generated-z2m
      zigbee2mqtt-auth-token:
        value: generated-token
    expect:
      terraform:
        - name: home-assistant-mqtt-password
          path: home-assistant/generated-secret
        - name: zigbee2mqtt-mqtt-password
          path: home-assistant/generated-secret
        - name: zigbee2mqtt-auth-token
          path: home-assistant/generated-secret
      flux:
        - name: home-assistant
          secrets:
            mqtt-homeassistant:
              data:
                password: "${terraform_output('home-assistant-mqtt-password', 'value')}"
            mqtt-zigbee2mqtt:
              data:
                password: "${terraform_output('zigbee2mqtt-mqtt-password', 'value')}"
            zigbee2mqtt-frontend:
              data:
                auth-token: "${terraform_output('zigbee2mqtt-auth-token', 'value')}"

  - name: uses supplied secrets and generates none
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        mqtt:
          homeassistant_password: ha-supplied
          zigbee2mqtt_password: z2m-supplied
        zigbee2mqtt:
          auth_token: token-supplied
    expect:
      flux:
        - name: home-assistant
          secrets:
            mqtt-homeassistant:
              data:
                password: "${home_assistant.mqtt.homeassistant_password}"
            mqtt-zigbee2mqtt:
              data:
                password: "${home_assistant.mqtt.zigbee2mqtt_password}"
            zigbee2mqtt-frontend:
              data:
                auth-token: "${home_assistant.zigbee2mqtt.auth_token}"
    exclude:
      terraform:
        - name: home-assistant-mqtt-password
        - name: zigbee2mqtt-mqtt-password
        - name: zigbee2mqtt-auth-token

  - name: generates only the secrets that are not supplied
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        zigbee2mqtt:
          auth_token: token-supplied
    terraformOutputs:
      home-assistant-mqtt-password:
        value: generated-ha
      zigbee2mqtt-mqtt-password:
        value: generated-z2m
    expect:
      terraform:
        - name: home-assistant-mqtt-password
          path: home-assistant/generated-secret
        - name: zigbee2mqtt-mqtt-password
          path: home-assistant/generated-secret
    exclude:
      terraform:
        - name: zigbee2mqtt-auth-token

  - name: skips secret generation when home_assistant is disabled
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: false
    exclude:
      terraform:
        - name: home-assistant-mqtt-password
        - name: zigbee2mqtt-mqtt-password
        - name: zigbee2mqtt-auth-token

  - name: rejects an unknown home_assistant.mqtt key
    values:
      dns:
        private_domain: home.example.com
      home_assistant:
        enabled: true
        mqtt:
          anonymous: true
    expectError: true
