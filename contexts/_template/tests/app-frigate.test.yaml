# app-frigate.yaml facet tests
# The facet takes an optional storage_class and needs dns.private_domain for its host name.

cases:
  - name: accepts frigate.enabled with a private domain
    values:
      dns:
        private_domain: home.example.com
      frigate:
        enabled: true

  - name: accepts a frigate.storage_class override
    values:
      dns:
        private_domain: home.example.com
      frigate:
        enabled: true
        storage_class: replicated

  - name: rejects an unknown frigate key
    values:
      dns:
        private_domain: home.example.com
      frigate:
        enabled: true
        node_selector:
          disk: ssd
    expectError: true

  - name: fails composition without dns.private_domain
    values:
      frigate:
        enabled: true
    expectError: true

  - name: skips the domain check when frigate is disabled
    values:
      frigate:
        enabled: false
