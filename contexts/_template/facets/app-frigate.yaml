kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: app-frigate
  description: Frigate camera recorder (placeholder, opt-in)

when: frigate.enabled == true

requires:
  - paths:
      - dns.private_domain
    message: Frigate publishes an HTTPRoute on the internal gateway, which core provisions only when dns.private_domain is set.
