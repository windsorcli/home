kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: app-frigate
  description: Frigate camera recorder (placeholder, opt-in)

when: frigate.enabled == true

requires:
  - paths:
      - dns.private_domain
    message: Frigate publishes an HTTPRoute on the internal gateway, which core provisions only when dns.private_domain is set.
  - when: (frigate.storage_class ?? 'single') == 'replicated' && !((cluster.storage.driver ?? 'openebs') == 'mayastor' || ((cluster.storage.driver ?? 'openebs') == 'longhorn' && (topology ?? 'single-node') == 'ha'))
    message: frigate.storage_class is replicated, but this cluster has no replicated class. Use a replicated storage driver, or remove frigate.storage_class.
  - when: (frigate.gateway ?? 'internal') == 'external' || (frigate.gateway ?? 'internal') == 'both'
    message: frigate.gateway is external or both, but home v0.1.0 has no external gateway, because home ADR 0001 forbids dns.public_domain. Set frigate.gateway to internal, or remove it.

config:
  - name: frigate_gateway
    value: "${frigate.gateway ?? 'internal'}"
