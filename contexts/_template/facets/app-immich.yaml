kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: app-immich
  description: Immich photo library (placeholder, opt-in)

when: immich.enabled == true

requires:
  - paths:
      - dns.private_domain
    message: Immich publishes an HTTPRoute on the internal gateway, which core provisions only when dns.private_domain is set.
